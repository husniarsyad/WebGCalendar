name: Calendar app and E2E tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  app:
    name: Check and build app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website-dev/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Check app
        run: npm run check

      - name: Build app
        run: npm run build

  e2e:
    name: Run browser automation
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: automation-testing
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation-testing/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install app dependencies for the web server
        run: npm ci --prefix ../website-dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright scenarios
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: automation-testing/test-results/
          if-no-files-found: warn
          retention-days: 14

  publish-report:
    name: Publish automation report
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v5
        with:
          name: playwright-report
          path: report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: report

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4