name: Calendar app and E2E tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  app:
    name: Check and build app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website-dev/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Check app
        run: npm run check

      - name: Build app
        run: npm run build

  e2e:
    name: Run browser automation
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: automation-testing
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation-testing/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install app dependencies for the web server
        run: npm ci --prefix ../website-dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright scenarios
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: automation-testing/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Add automation result to summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Website automation"
            echo ""
            echo "Playwright tests completed with status: **${{ job.status }}**"
            echo ""
            echo "The full HTML report and step screenshots are available in the playwright-report and playwright-test-results workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  comment-result:
    name: Comment automation result
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Comment on pull request
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ needs.e2e.result }}';
            const body = [
              '## Website automation result',
              '',
              `Playwright status: **${status}**`,
              '',
              'The website check/build runs separately. The HTML report and screenshots are available in this workflow run under **Artifacts**.'
            ].join('\\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  publish-report:
    name: Publish automation report
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v5
        with:
          name: playwright-report
          path: report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: report

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4