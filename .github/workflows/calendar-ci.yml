name: Calendar app and E2E tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Check and build app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website-dev/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Check app
        run: npm run check

      - name: Build app
        run: npm run build

  e2e:
    name: Run browser automation
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: automation-testing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation-testing/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright scenarios
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: automation-testing/test-results/
          if-no-files-found: warn
          retention-days: 14